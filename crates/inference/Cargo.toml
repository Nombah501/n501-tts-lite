[package]
name = "inference"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = { version = "0.9.1", default-features = false }
candle-transformers = { version = "0.9.1", default-features = false }
hex = "0.4"
rubato = "0.16"
sha2 = "0.10"
thiserror = "1"
tokenizers = "0.15"
ureq = "2"

[features]
default = ["cpu"]
cpu = []
cuda = ["candle-core/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-transformers/metal"]

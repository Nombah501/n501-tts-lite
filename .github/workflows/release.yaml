name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate changelog
      id: changelog
      run: |
        echo "## What's Changed" > changelog.md
        echo "" >> changelog.md
        echo "See [product brief](./_bmad-output/planning-artifacts/product-brief-my_new_project-2026-01-04.md) for details." >> changelog.md

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        body_path: changelog.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    name: Build and Upload
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: n501-tts-lite-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: n501-tts-lite-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: n501-tts-lite-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: n501-tts-lite-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.0-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install create-dmg

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: target/${{ matrix.target }}/release/n501-tts-lite${{ matrix.os == 'windows-latest' && '.exe' || '' }}
        asset_name: ${{ matrix.artifact_name }}
        asset_content_type: application/octet-stream

version: 2
updates:
  # Enable version updates for Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "Nombah501"
    assignees:
      - "Nombah501"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "Nombah501"
    assignees:
      - "Nombah501"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # Enable version updates for npm (Tauri dependencies)
  - package-ecosystem: "npm"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "Nombah501"
    assignees:
      - "Nombah501"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
